# ===================================================================
# Production Profile Configuration for Managed Cloud Deployment
# Target: Render Free Web Service + Neon PostgreSQL Free Tier
# ===================================================================

# Database Connectivity (Credentials must be explicitly supplied in environment)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate DDL Safety
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
hms.deployment.mode=deployment
hms.release-attestation.required=true
hms.release-attestation.expected-database-oid=${HMS_RELEASE_ATTESTATION_EXPECTED_DATABASE_OID:${HMS_EXPECTED_DATABASE_OID:}}

# Session Cookie Hardening for Cross-Origin HTTPS
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None

# Public Frontend URL for OAuth Redirects and Entry Points
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allow-localhost=false

# Reverse Proxy Header Handling (Render, Nginx, Cloudflare HTTPS termination)
server.forward-headers-strategy=framework

# S3-Compatible Private Document Storage (Production Linux Container)
hms.document-storage.enabled=${HMS_DOCUMENT_STORAGE_ENABLED:true}
hms.document-storage.provider=s3
hms.document-storage.s3-endpoint=${HMS_S3_ENDPOINT:}
hms.document-storage.s3-region=${HMS_S3_REGION:us-east-1}
hms.document-storage.s3-bucket=${HMS_S3_BUCKET:}
hms.document-storage.s3-access-key=${HMS_S3_ACCESS_KEY:}
hms.document-storage.s3-secret-key=${HMS_S3_SECRET_KEY:}
hms.document-storage.master-key-version=${HMS_DOCUMENT_MASTER_KEY_VERSION:1}
hms.document-storage.master-key-secret=${HMS_DOCUMENT_MASTER_KEY_V1:}

# WebRTC & Video Consultation Security Gate (Disabled by default in production)
hms.webrtc.enabled=${HMS_WEBRTC_ENABLED:false}
