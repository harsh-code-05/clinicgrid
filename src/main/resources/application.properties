spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
hms.deployment.mode=${HMS_DEPLOYMENT_MODE:local}
hms.release-attestation.required=${HMS_RELEASE_ATTESTATION_REQUIRED:false}

# Session Cookie Configuration (Configurable for local dev vs cross-origin HTTPS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:Lax}

# Google OAuth 2.0 credentials are read directly from GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# by GoogleOAuthConfiguration when configured, avoiding premature auto-config validation crashes.

# Frontend Origin and Dynamic Redirect URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allow-localhost=${CORS_ALLOW_LOCALHOST:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.resolve-lazily=true
hms.document-storage.multipart-staging-dir=${java.io.tmpdir}/hms-multipart-staging
spring.servlet.multipart.location=${hms.document-storage.multipart-staging-dir}
hms.document-storage.purge-cron=-
hms.document-storage.purge.enabled=false
hms.scheduling.zone-id=Asia/Kolkata

# Cloudflare Workers AI (Free Plan Only)
hms.ai.provider=${HMS_AI_PROVIDER:FAQ}
hms.ai.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
hms.ai.cloudflare.api-token=${CLOUDFLARE_AI_TOKEN:}
hms.ai.cloudflare.model=${CLOUDFLARE_AI_MODEL:@cf/zai-org/glm-4.7-flash}
hms.ai.cloudflare.base-url=${CLOUDFLARE_AI_BASE_URL:https://api.cloudflare.com/client/v4}
hms.ai.cloudflare.timeout-seconds=${CLOUDFLARE_AI_TIMEOUT_SECONDS:60}
hms.ai.cloudflare.max-tokens=${CLOUDFLARE_AI_MAX_TOKENS:1536}
hms.ai.cloudflare.temperature=${CLOUDFLARE_AI_TEMPERATURE:0.3}
hms.ai.cloudflare.max-concurrent=${CLOUDFLARE_AI_MAX_CONCURRENT:5}

# WebRTC & Video Consultation (STUN/TURN)
hms.webrtc.enabled=${HMS_WEBRTC_ENABLED:false}
hms.webrtc.stun-urls=${HMS_WEBRTC_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
hms.webrtc.turn-url=${HMS_WEBRTC_TURN_URL:}
hms.webrtc.turn-username=${HMS_WEBRTC_TURN_USERNAME:}
hms.webrtc.turn-credential=${HMS_WEBRTC_TURN_CREDENTIAL:}
